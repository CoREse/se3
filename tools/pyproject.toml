[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "se3-tools"
version = "0.1.0"
description = "SE 3.0 framework CLI tools"
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.scripts]
se3 = "se3_tools.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["se3_tools"]
