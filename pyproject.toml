[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "se3"
version = "3.6.0"
description = "SE 3.0 framework - Pure CLI flow engine"
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.scripts]
se3 = "se3.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/se3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
