[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "se3"
version = "7.4.1"
description = "SE 3.0 framework - Pure CLI flow engine"
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    # Subprocess resource monitoring: hang detection in the agent runner
    # (`claude_runner.py`, Linux only) and process discovery in the daemon
    # supervisor (`daemon/supervisor.py`). Both import it defensively, but it
    # is a real runtime dependency of the core package and so is declared here.
    "psutil>=5.9.0",
]

[project.optional-dependencies]
# Heavy web dependencies for the central server (`se3-server`). Kept out of
# the core `[project].dependencies` so a core-only `pip install se3` stays
# dependency-clean. `websockets` is also what the daemon's outbound client
# uses to dial the server.
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
]
# Headless-browser dependency for the UI render acceptance test
# (`tests/test_console_real_daemon_e2e.py::test_render_paradigm_in_headless_browser`).
# Installing the Python package is not sufficient on its own: after
# `pip install se3[browser]` you MUST also download the Chromium binary with
# `playwright install chromium`. Without it the critical acceptance test fails
# loudly (it is registered under `test.critical_tests` in se3.yaml) rather than
# silently skipping.
browser = [
    "playwright>=1.40.0",
]

[project.scripts]
se3 = "se3.cli:app"
se3-server = "se3.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/se3"]
# Ship the server's bundled static frontend assets in the wheel.
artifacts = ["src/se3/server/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
