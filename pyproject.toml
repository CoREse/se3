[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tianluo"
version = "12.0.1"
description = "tianluo (田螺) - autonomous SE 3.0 flow engine: prompt once, walk away, come back to a finished deliverable"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Zhendong Zhang (CRE)", email = "zzdzhangzzd@hotmail.com" },
]
keywords = [
    "ai",
    "agent",
    "autonomous",
    "flow-engine",
    "llm",
    "software-engineering",
    "claude",
    "developer-tools",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    # Subprocess resource monitoring: hang detection in the agent runner
    # (`claude_runner.py`, Linux only) and process discovery in the daemon
    # supervisor (`daemon/supervisor.py`). Both import it defensively, but it
    # is a real runtime dependency of the core package and so is declared here.
    "psutil>=5.9.0",
    # PTY process driver for the interactive Claude Code runner
    # (`claude_interactive_runner.py`): spawns an interactive `claude` session
    # in a pseudo-terminal and feeds the prompt as simulated user input. It is
    # imported lazily — only when a `claude-interactive` agent is actually
    # constructed — so a project that never opts into this runner pays nothing,
    # but it is a real runtime dependency of the core package and so is
    # declared here.
    "pexpect>=4.8.0",
]

[project.optional-dependencies]
# Heavy web dependencies for the central server (`tianluo-server`). Kept out of
# the core `[project].dependencies` so a core-only `pip install tianluo` stays
# dependency-clean. `websockets` is also what the daemon's outbound client
# uses to dial the server.
server = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
    # Slow password hashing (argon2id) for the multi-tenant local auth
    # provider. Kept in the [server] extra so a core-only install never
    # imports it: `tianluo.cli` / `tianluo.daemon` must not depend on argon2. The
    # crypto layer prefers argon2-cffi and only falls back to bcrypt when
    # argon2 is unavailable. The embedded persistence layer uses stdlib
    # `sqlite3`, so no extra dependency is needed for storage.
    "argon2-cffi>=21.3.0",
]
# Headless-browser dependency for the UI render acceptance test
# (`tests/test_console_real_daemon_e2e.py::test_render_paradigm_in_headless_browser`).
# Installing the Python package is not sufficient on its own: after
# `pip install tianluo[browser]` you MUST also download the Chromium binary with
# `playwright install chromium`. Without it the critical acceptance test fails
# loudly (it is registered under `test.critical_tests` in tianluo.yaml) rather than
# silently skipping.
browser = [
    "playwright>=1.40.0",
]

[project.urls]
Homepage = "https://github.com/CoREse/tianluo"
Repository = "https://github.com/CoREse/tianluo"
Changelog = "https://github.com/CoREse/tianluo/blob/master/VERSIONS.md"
Issues = "https://github.com/CoREse/tianluo/issues"

[project.scripts]
# `luo` is the primary command ("call it by its short name"), `tianluo` the
# full-name entry for docs and discoverability. `se3` / `se3-server` are
# transitional aliases from the rename (12.0.0): they print a one-line
# deprecation notice on first use and will be removed in 13.0.0.
luo = "tianluo.cli:app"
tianluo = "tianluo.cli:app"
se3 = "tianluo.cli:legacy_app"
tianluo-server = "tianluo.server:main"
se3-server = "tianluo.server:legacy_main"

[tool.hatch.build.targets.sdist]
# Explicit allow-list: the repo root also hosts the (gitignored) runtime
# directory with worktrees/history/logs — without this the sdist build
# crawls gigabytes of runtime content.
only-include = [
    "src/tianluo",
    "src/se3",
    "docs",
    "README.md",
    "README.zh.md",
    "LICENSE",
    "NOTICE",
    "VERSIONS.md",
    "tianluo.example.yaml",
]

[tool.hatch.build.targets.wheel]
# `src/se3` is the 12.x compatibility shim (aliases `import se3` and
# `python -m se3` onto the renamed `tianluo` package); dropped in 13.0.0.
packages = ["src/tianluo", "src/se3"]
# Non-Python resources that must survive packaging: the server's bundled static
# frontend assets, and the CLI locale catalogs — tianluo.i18n loads the latter via
# importlib.resources, so a wheel without them degrades every t() call to raw
# keys instead of localized text.
artifacts = [
    "src/tianluo/server/static/**",
    "src/tianluo/i18n/locales/*.json",
]

[tool.pytest.ini_options]
# Charter permits engine-colocated pytest modules under src/tianluo/engine/ (tightly
# coupled to private step internals); include that path so the default pytest run
# discovers them alongside tests/ instead of silently skipping them.
testpaths = ["tests", "src/tianluo/engine"]
pythonpath = ["src"]
# Deselect the Chromium e2e test — it requires libnspr4.so / playwright
# which are not available in this environment. The node-stub sibling
# covers the same rendering logic.
addopts = "--deselect=tests/test_console_real_daemon_e2e.py::test_render_paradigm_in_headless_browser"
