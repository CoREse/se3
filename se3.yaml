# SE 3.0 Framework Configuration
# Place in project root

max_tasks_per_change: 5

human_call:
  timeout_days: 7
  directory: se3/calls  # Human calls directory (legacy: human-calls)
  language: zh-CN  # Language for human call messages (e.g., zh-CN, en-US)

session:
  progress_file: progress.md
  max_progress_entries: 20

# Confirmation (Review) Configuration
# Controls the confirmation steps that review propose/design/plan_tasks outputs
confirmation:
  enabled: true                       # Enable confirmation steps
  steps: ["propose", "design"]        # Steps after which to insert confirmation
  reviewer: "human"                   # Default reviewer: "human" or "llm"
  # LLM reviewer configuration (used when reviewer="llm")
  llm_reviewer:
    model: null                       # Model to use (null = default)
    max_iterations: 3                 # Max review-modify cycles per step

# Claude command resolution (optional)
# Multiple commands with priority-based fallback on usage limit / timeout
# Higher priority = tried first. Project-level overrides global (~/.se3/config.yaml)
claude_commands:
  # - cmd: "claude"
  #   priority: 10
  - cmd: "kclaude"
    priority: 5
  - cmd: "hclaude"
    priority: 1

# E2E / Visual regression testing (optional)
# Requires Puppeteer MCP or similar browser automation tool
e2e:
  baseline_dir: .e2e-baselines        # Where to store baseline screenshots
  diff_threshold: 0.1                 # Pixel difference threshold (0-1)
  default_viewport: "1280x720"        # Default browser viewport size
  test_paths: []                      # URL paths to test (e.g., ["/", "/login"])
