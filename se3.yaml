# SE 3.0 Framework Configuration
# Place in project root

human_call:
  timeout_days: 7
  directory: se3/calls  # Human calls directory (legacy: human-calls)
  language: zh-CN  # Language for human call messages (e.g., zh-CN, en-US)

session:
  progress_file: progress.md
  max_progress_entries: 20

# Agent Registry (top-level identity layer)
# Every `llm_caller.*` or `confirmation.steps.*.reviewer` reference is
# resolved by name against this dict. Unknown names fail fast at startup.
# Global + project merge is entry-level: project entries override global
# entries with the same name; non-conflicting entries coexist.
agents:
  primary: { type: claude-code, cmd: claude, priority: 10 }
  backup: { type: claude-code, cmd: kclaude, priority: 5 }
  low:    { type: claude-code, cmd: hclaude, priority: 1 }

# LLM Caller Configuration
# `defaults` is the default caller chain by agent name (referencing
# entries in `agents` above). `steps.<step>` declares a HARD per-step
# override — there is no silent fallback to `defaults`, so if you want a
# default tail you must list it explicitly. Rotation on infrastructure
# errors happens strictly within the step's list.
llm_caller:
  defaults: [primary]
  steps:
    implement: [primary]
    summarize: [primary]

# Confirmation (Review) Configuration
# Per-step dict: a step is confirmed iff it appears as a key here.
# There is NO global on/off switch. Per-step `reviewer` accepts:
#   - "human"        → MCP call file / interactive approval pathway
#   - <agent name>   → single-agent LLM review against that agent
#   - omitted / null → LLM review via `llm_caller.defaults`
confirmation:
  steps:
    plan:
      # reviewer omitted → LLM review via llm_caller.defaults
      max_iterations: 3

# Version Bumping Configuration
# Automatically bump version on commit step based on task type
version:
  enabled: true                       # Enable automatic version bumping
  file_path: null                     # Explicit version file path (null = auto-detect)
  include_in_commit_message: true     # Include version in commit message
  auto_bump: true                     # Auto-apply bump without human confirmation

  # Optional: customize version rules by creating se3/version-rules.md
  # (natural-language Markdown). When absent, default SemVer 2.0.0 applies.

# E2E / Visual regression testing (optional)
# Requires Puppeteer MCP or similar browser automation tool
# Language Configuration
# Controls the language used in human-facing outputs and spec writing
language:
  language: zh-CN                        # Language for human-facing steps (summarize, discovery, confirmed steps)
                                        # e.g., "zh-CN", "en-US". null = no restriction (LLM decides)
  spec_language: en-US                   # Language for spec writing (update_spec step)
                                        # e.g., "zh-CN", "en". null = no restriction (LLM decides)

e2e:
  baseline_dir: .e2e-baselines        # Where to store baseline screenshots
  diff_threshold: 0.1                 # Pixel difference threshold (0-1)
  default_viewport: "1280x720"        # Default browser viewport size
  test_paths: []                      # URL paths to test (e.g., ["/", "/login"])

workflow:
  max_fix_iterations: 30
