id: '031'
title: SE3 工具评估与优化方向
description: |
  基于 3.49.* 全步骤对齐审查的综合评估。

  ## 核心价值（已验证）

  1. Fix loop（implement → test → 自动修复 → 重测试）：LLM 一次写对率 60-70%，
     fix loop 可提升至 90%+。这是最大的自动化价值。
  2. 状态持久化 + 可恢复：长任务中断后 se3 run --resume 接续，
     解决 LLM 对话断了就丢上下文的痛点。
  3. Spec 驱动开发：50+ feature 后 spec 成为最好的项目文档，
     支撑跨 session 接力和多 agent 协作。

  ## 需要解决的问题

  ### 可靠性（已部分修复）
  - 3.49.12-18 修复了 DAG merge-back 静默丢弃代码、update_spec 从未写文件、
    test timeout 失效、analyze 忽略 --type 等核心 bug
  - 需要更多集成测试覆盖关键路径，防止回归

  ### 流程减重（待做）
  当前 feature 12 步 / bugfix 10 步，LLM 调用 10+ 次。可优化为：
  - project_summary：不需要 LLM，直接传 git info
  - analyze：不需要 LLM，关键词匹配 + --type flag
  - propose + design：可合并为一步
  - 目标：bugfix 3-4 步，feature 6-7 步，LLM 调用减半

  ### 架构改进（已记录为独立 issue）
  - #029: verify_spec 与 update_spec 的顺序和职责边界
  - #030: STEP_POOL 声明式驱动数据流替代 if/elif 链

  ## 适用场景评估

  - 个人开发 + 复杂任务：中等有用（fix loop + 状态持久化）
  - 个人开发 + 简单任务：不如直接用 Claude Code
  - 团队协作：很有用（流程标准化、审计追踪、spec 维护）
  - 多 agent 协作：最大想象空间（状态机 + worktree 隔离 + spec 验证是必要基础设施）

  ## 结论
  Fix loop 和状态持久化已经值回票价。下一阶段应做减法（减少 LLM 调用、
  合并冗余步骤），而不是加更多功能。
