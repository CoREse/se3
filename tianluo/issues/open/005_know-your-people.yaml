id: '005'
title: Know Your People (知人善任)
description: 'Track granular capability profiles for different models, going beyond
  simple "good/bad" scores to understand *what each model is good at*.

  Current model selection is often binary (use Claude or not). But different models
  may excel at different aspects of software development:

  - Some models may be better at architecture/design

  - Others may excel at implementation details

  - Some may produce more testable code

  - Others may be better at debugging

  Understanding these differences enables "horses for courses" model selection.'
