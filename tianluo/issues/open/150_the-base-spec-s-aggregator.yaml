id: '150'
title: 'The `base` spec''s `aggregator.py` bullet enumerates exactly three sources
  for MachineStatus.project_roots: (a) the in-memory active `_project_roots`, (b)
  roots from `enumerate_historical_project_roots`, and (c) ensure-init roots. The
  implementation introduces a durable fourth source — the persistent `pid_dir/project_roots.json`
  registry that survives daemon restarts and zero-live-process periods. The observable
  contract (a union of live + historical roots feeding the dropdown/index) is preserved,
  so this is not a regression, but the spec''s detailed source enumeration is now
  slightly behind the code.'
