description: 'The frontend .mjs tests (interaction_view.test.mjs, test_app_pure.mjs)
  are still not wired into automated CI — they only appear in tests/frontend/SMOKE_CHECKLIST.md
  as a manual `node ...` step. The Python-only pytest suite does not execute them,
  so frontend regression coverage remains manual.


  Suggestion: Add a CI job (or a pytest wrapper that shells out to `node`) to run
  the .mjs files automatically. This is already tracked by open issues 109/110 and
  does not block the current flow.'
