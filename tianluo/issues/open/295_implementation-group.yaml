  摘要

  G1. G1 vocabulary layer for the single-path plan model. config.py: added DEFAULT_PLAN_DECOMPOSITION/VALID_PLAN_DECOMPOSITIONS
  (capability|granular) and DEFAULT_PLAN_GRANULARITY/VALID_PLAN_GRANULARITIES (auto|single|conservative),
  WorkflowConfig.plan_decomposition/plan_granularity plus *_explicit flags, fail-fast
  validation naming the config path and legal values, and a one-version LEGACY_STRATEGY_TO_PLAN_MODE
  mapping table applied at the from_dict boundary (direct->granularity single, planned->decomposition
  granular, auto->new defaults) that yields to explicitly-written new keys and emits
  a per-process-deduped deprecation warning

  G2. removed implementation_strategy/implementation_strategy_explicit fields, resolve_implementation_strategy(),
  and the DEFAULT_/VALID_IMPLEMENTATION_STRATEGIES constants. cli.py: added --plan-decomposition/--plan-granularity
  with render_full+Exit(1) validation, kept --implementation-strategy as a deprecated
  alias that prints an i18n notice and translates through the same config-owned mapping
  table

  G3. all four dispatch sites forward the two new kwargs. commands/run.py: run_flow/_run_flow_impl/run_worktree_mode
  signatures now carry plan_decomposition/plan_granularity forwarded to create_flow

  G4. the identifier implementation_strategy no longer appears in the module, and
  a why-comment at the resume dispatch records that plan mode is decided once and
  never re-decided on resume. i18n: 5 new keys in both catalogs with real zh-CN translations,
  legacy help text retagged deprecated.

  G5. G2 engine core: retired the implementation_strategy routing axis and unified
  feature/bugfix/discovery on a single ANALYZE -> PLAN -> IMPLEMENT path. Deleted
  implementation_strategy.py (552 lines) and added the narrower plan_decomposition.py,
  which owns only the capability|granular doctrine + auto|single|conservative granularity
  enums, their three context keys, write-once initialize_context and a read-only legacy-tolerant
  view -- and deliberately no step-sequence transform, snapshot/restore, or legacy
  sequence inference, since none of those have a reason to exist once the sequence
  stops depending on the decision. create_flow no longer trims PLAN

  G6. analyze no longer asks for or persists a direct|planned recommendation and no
  longer needs the atomic snapshot/restore wrapper around its sequence rebuild

  G7. _build_step_inputs and get_progress and build_context_from_flow project the
  new keys plus a plan_group_count derived from PLAN''s task_groups. state_machine''s
  _is_holistic_implement_step now keys on ''capability doctrine + exactly one group''
  rather than a routing flag. New tests/engine/test_plan_decomposition.py (57 cases)
  replaces test_implementation_strategy.py, covering resolver priority, write-once
  persistence and resume-after-config-change, invalid-value fail-fast, legacy read-only
  projection, PLAN surviving every plan mode across all plan-bearing types, byte-identical
  planless sequences, and the absence of strategy vocabulary from the ANALYZE prompt/outputs.

  G8. G3: landed the capability decomposition doctrine in PLAN (four sizing criteria
  keyed on what one autonomous implement call can carry, three mutually-exclusive
  granularity tiers, an artifact-split guardrail in the same form as VERSION_FILE_GUARDRAIL,
  and a coarse five-field group schema with no tasks array), with granular preserved
  as a byte-identical legacy prompt. IMPLEMENT''s holistic decision and the state
  machine''s auto-continuation gate now share one predicate in plan_decomposition
  (small type, or capability + exactly one group) instead of reading a routing flag.
  Capability mode bypasses the LOC gate in both the merge short-circuit and _should_use_dag,
  since coarse groups carry no estimated_loc and a zero total would silently serialize
  independent groups

  G9. the use_worktree / linear-chain / no-commits short-circuits and all granular
  LOC behaviour are unchanged. Every task_groups consumer now tolerates groups without
  a tasks array: a new TaskDataValidator.validate_groups accepts them while still
  checking inter-group dependency references and cycles, and the tree/table/summary/dependency
  views plus the implement-plan panel and plan step renderer fall back to group-level
  rendering rather than reporting an empty plan.

  G10. G4: degraded plan-confirm from an always-on gate to an ordinary opt-in per-step
  confirmation, and repointed its reviewer prompt at the grouping. config.py loses
  _PLAN_STEP_NAME and all three plan special-cases (insertion, synthesized default
  entry, max_iterations baking), so plan shares the generic confirmation.steps path
  -- unconfigured means no CONFIRM after PLAN and resolve_confirm_inputs(''plan'')
  returns None, while confirmation.steps.plan: {reviewer: human} keeps the manual
  grouping gate. build_plan_confirm_prompt gained a decomposition parameter and dispatches
  on it: capability yields a new grouping review (group count vs. volume of work,
  forbidden artifact-type/layer splits, depends_on soundness) that explicitly declines
  to ask for a per-requirement task decomposition

  G11. granular keeps the legacy requirement-coverage text verbatim

  G12. both share the {approved, feedback} contract so _llm_review is reused untouched.
  confirm.py reads the doctrine from the persisted flow context so a resumed flow
  is reviewed under the doctrine it was planned with, and an unrecognized value falls
  back to capability rather than silently selecting legacy. The three-layer downgrade
  rationale is recorded as WHY:-prefixed line comments at both sites (line comments,
  not docstrings, because invariant_check''s hard guard only harvests # / // comments).
  Deleted tests/test_plan_confirm_always_on.py, whose subject no longer exists, folding
  its inverted config-layer coverage into the rewritten prompt test file

  G13. fixed three other suites that asserted PLAN is always followed by CONFIRM.

  G14. G5 control plane: replaced the implementation_strategy projection with a plan_mode
  projection (decomposition / granularity / group_count / legacy_strategy) across
  strategy_view.py, the daemon aggregator + history reader, server state, CLI history
  show and the WebUI. plan_mode_view describes a pre-model flow by the retired path
  it recorded rather than a doctrine it never chose, and never writes back. plan_group_count_from_state
  resolves an externalized PLAN body through its cold_ref, memoized on the ref''s
  content hash so the plan document is read once per plan revision instead of once
  per poll. Protocol bumped to 8 with optional plan_decomposition / plan_granularity
  spawn fields, SPAWN_PLAN_* value sets and supports_spawn_plan_mode

  G15. the server refuses an explicit plan mode to a pre-8 daemon with an explainable
  501 instead of a silent downgrade, and the retired implementation_strategy field
  stays accepted for one version, mapped daemon-side with a deprecation log. Daemon
  spawner appends --plan-decomposition / --plan-granularity only when set. WebUI:
  four plan-mode selects (New Task + Issue Launch), new chip / sidebar / history-meta
  renderers, and full en-US + zh-CN key sets. Tests updated across protocol, daemon,
  server, CLI history, i18n manifests and the Node frontend suites, including a pre-8-daemon
  capability-refusal case and cold-ref group-count cases.

  G16. G6 documentation and charter: rewrote the bilingual configuration reference''s
  workflow section around plan_decomposition / plan_granularity (with a retired-key
  section carrying the three-row deprecation mapping and the next-major removal date),
  narrowed group_loc_threshold to granular-only with its rationale, and restated plan-confirm
  as an ordinary opt-in per-step gate whose reviewer prompt follows the persisted
  doctrine. Replaced the implementation_strategy comment block in tianluo.example.yaml
  with commented examples of both new keys plus the compat note, and corrected its
  always-on plan-confirm comment. Rewrote both READMEs'' strategy sections as ''one
  path

  G17. the execution shape is read off the group count'', documented the capability
  doctrine''s four sizing criteria and artifact-split ban, the three granularity tiers
  and granular-as-legacy, and swapped --implementation-strategy in the command reference
  for the two new options with the old one marked deprecated

  G18. also corrected the state diagram, the human-attention evidence line and the
  code-enforced-properties bullet that still asserted always-on plan-confirm. Retitled
  the charter paragraph to ''Task type vs. PLAN decomposition'', preserving the runner-native-loop
  passage verbatim. Repo-wide sweep confirms every residual implementation_strategy
  reference is one of the four deliberate compatibility points

  G19. full tests/ suite green (10302 passed, 1 skipped, 1 deselected, 602s).

