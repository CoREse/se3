  提案

  摘要

  取消 direct/planned 双路径路由：删除 `ImplementationStrategyResolver` 及其全部调用点，feature/bugfix/discovery
  一律 ANALYZE → PLAN → IMPLEMENT。PLAN 改为默认的 capability 分组学说——按『一次自治 implement 调用能否安全承载』产出粗粒度任务组（组数
  ≥ 1，单组即今日 direct 的等价形态），并加入与 VERSION_FILE_GUARDRAIL 同形式的『禁止按制品类型/层次切分』硬禁令。新增 `workflow.plan_decomposition`（capability|granular）与
  `workflow.plan_granularity`（auto|single|conservative）两个配置键及对应 CLI 覆盖选项，`workflow.implementation_strategy`
  / `--implementation-strategy` 退役并保留一版带 deprecation 警告的兼容映射；plan-confirm 由 always-on
  降级为与其他步骤一致的可选 per-step 确认，其 reviewer prompt 在 capability 模式下改审分组粒度。


