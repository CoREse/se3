  设计

  概览

  把『执行形态』的决定权从一条独立的策略路由轴，收回到 PLAN 的分解结果里。新增 `src/tianluo/engine/plan_decomposition.py`
  作为 `implementation_strategy.py` 的替代者，但职责显著收窄：它只承载『分解学说 + 粒度档位』的枚举、context key、一次性初始化与只读投影，不再拥有任何步骤序列变换（`apply_to_steps`
  整体删除）、不再需要 snapshot/restore（因为不再有『决策与序列必须原子持久化』的耦合），也不再需要 legacy 序列推断来倒推路径。feature/bugfix/discovery
  的默认序列本来就含 PLAN，删掉裁剪即得单一路径。PLAN 侧新增 capability 模式的 prompt 组：grouping doctrine（唯一依据是『一次自治
  implement 调用能否安全承载』，聚合越多阈值越低）、artifact-type 切分硬禁令（与 VERSION_FILE_GUARDRAIL 同形式的
