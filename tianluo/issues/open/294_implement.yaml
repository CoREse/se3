  \ untouched.\n\nTargeted verification: tests/test_annotation_resolvability.py, tests/test_config.py,\
  \ tests/test_import_isolation.py — 98 passed. The full test suite run was still\
  \ in progress (~37%) at the time of reporting and had not yet landed.\n\n──────────────────────────────────────────────────\n\
