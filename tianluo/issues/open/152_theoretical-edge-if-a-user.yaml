id: '152'
title: 'Theoretical edge: if a `user`/`system` record carried a timestamp falling
  strictly between two partial fragments of the SAME turn, the accumulating bubble''s
  __convTs is bumped to the latest fragment while the bubble keeps its original DOM
  slot, so it could sit before a lower-ts intervening bubble — a minor deviation from
  strict (timestamp, index) ordering. This cannot occur in practice: stream_progress
  fragments are emitted within a single in-flight LLM turn before its final result,
  and user/system records only appear at step boundaries, never interleaved mid-stream.
  Merging same-turn partials into one bubble (taking the latest timestamp) is itself
  the explicit intent of the new requirement.'
description: 'Theoretical edge: if a `user`/`system` record carried a timestamp falling
  strictly between two partial fragments of the SAME turn, the accumulating bubble''s
  __convTs is bumped to the latest fragment while the bubble keeps its original DOM
  slot, so it could sit before a lower-ts intervening bubble — a minor deviation from
  strict (timestamp, index) ordering. This cannot occur in practice: stream_progress
  fragments are emitted within a single in-flight LLM turn before its final result,
  and user/system records only appear at step boundaries, never interleaved mid-stream.
  Merging same-turn partials into one bubble (taking the latest timestamp) is itself
  the explicit intent of the new requirement.


  Suggestion: No change needed for current behavior. If strict ordering of an interleaved
  non-partial against an accumulating turn ever becomes a real concern, re-run insertBubbleSorted
  (or a position fix-up) on the accumulating bubble after bumping its __convTs/__convIdx.'
