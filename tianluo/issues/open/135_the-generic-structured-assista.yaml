id: '135'
title: The generic structured assistant renderer (makeStructuredAssistantRenderer)
  feeds the raw LLM-emitted JSON to report renderers (STEP_REPORT_RENDERERS) that
  were designed to consume the backend's post-processed `step.outputs`. For step types
  where the backend handler renames/transforms fields before persisting outputs, the
  report renderer may surface only a partial set of fields (or none) from the raw
  assistant JSON. This never loses data — the renderer degrades gracefully to the
  process/markdown fallback when it produces no content, and the full process (展开全部)
  and raw NDJSON (查看原始) layers remain available — but a step type with significant
  field divergence could show a thinner default structured view than its end-of-step
  report card.
description: 'The generic structured assistant renderer (makeStructuredAssistantRenderer)
  feeds the raw LLM-emitted JSON to report renderers (STEP_REPORT_RENDERERS) that
  were designed to consume the backend''s post-processed `step.outputs`. For step
  types where the backend handler renames/transforms fields before persisting outputs,
  the report renderer may surface only a partial set of fields (or none) from the
  raw assistant JSON. This never loses data — the renderer degrades gracefully to
  the process/markdown fallback when it produces no content, and the full process
  (展开全部) and raw NDJSON (查看原始) layers remain available — but a step type with significant
  field divergence could show a thinner default structured view than its end-of-step
  report card.


  Suggestion: Optional, post-merge: spot-check one or two non-discovery step types
  (e.g. analyze, test) against real history to confirm the raw assistant JSON field
  names match what the report renderer reads; if any diverge, add a small per-step
  field-normalization shim before delegating. Not blocking — the spec only requires
  coverage of all step types plus graceful fallback, both of which are satisfied.'
