description: 现在文件夹的hash是怎么算的？我想更新一下文件夹和文件的code-index更新的时机，现在是hash变了就更新，但很多时候，你改某个文件里的某一行内容并不会变更这个文件夹的作用，所以对文件夹的code-index重新总结完全是浪费。所以我的想法是，对文件夹和文件而言，增加另一个hash，这个hash只看它次一级item的列表有没有变化。也就是对文件夹而言，看它下面一层的文件/文件夹的名字列表有没有变化（增加减少变更），对文件而言，也是看它下面一层的内容（函数，标题等）列表有没有变化。判断变化的方式也是记录列表的hash。你觉得是不是更好？有什么额外建议吗？
