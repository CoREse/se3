  设计

  概览

  两条互不相干的改动线。A 线在 src/tianluo/engine/steps/implement.py 顶部区域新增一个模块级常量（例如 TEST_SCOPE_AND_HEADLESS_CLAUSE），承载两条要点的英文条目式文案（≤80
  词、无花括号）：(1) 全量测试由 flow 后续 TEST step 统一执行，agent 默认只跑与本次改动直接相关的测试，仅在有具体理由预期波及所触模块之外时才自行跑全量、且必须前台跑到出结果，不得以『全量测试未跑完/结果未观察』作为未完成项汇报，estimated_test_duration
  仍按现有说明填整套估时；(2) agent 以无头方式运行，本轮输出结束即进程退出，不存在之后被唤醒，不得遗留后台任务/监视器/等通知式收尾，所有汇报依赖的工作必须在输出最终
  JSON 前完成。该常量经一个锚点式插入（缺锚点即抛错的辅助函数，语义同现有 _substitute_anchor）分别插进三份基础 prompt 的 estimated_test_duration
  说明紧邻位置，插入时机在 VERSION_FILE_GUARDRAIL / WHY_COMMENT_CONVENTION 拼接与 HOLISTIC / CAPABILITY
  派生之前，从而由派生变体自然继承。同时把 FIX_PROMPT 的 incomplete_tasks 字段说明改写为与 IMPLEMENT_PROMPT / IMPLEMENT_GROUP_PROMPT
  现有措辞一致的版本（含『Only populate when completion_status is "partial" or "failed"』语义，complete
  时必须为空数组）。B 线在 src/tianluo/engine/step_renderers.py::_render_implement 的 Incomplete
  Tasks 区块内按 completion_status 分叉：complete 走新的中性标题 key 与中性项目符号，其余（partial / failed
  / unknown / 缺失）保持现有红色标题与红 ✗ 不变；新标题 key 加入 en-US.json 与 zh-CN.json 的 cli.steprender.implement.*
  命名空间。


  组件 (5)

  共用 prompt 文案常量（implement.py 模块级） — 以英文条目式承载两条要点（测试范围默认针对性、无头运行契约），≤80 词、不含花括号，是三份基础
  prompt 的唯一文案来源。

  锚点插入逻辑（implement.py 模块加载期） — 把共用文案插到三份基础 prompt 各自 estimated_test_duration 说明的紧邻位置；锚点缺失时抛错。执行时机必须早于
  VERSION_FILE_GUARDRAIL / WHY_COMMENT_CONVENTION 拼接、inject_boundary 标记注入与 HOLISTIC
  / CAPABILITY_GROUP 派生。

  FIX_PROMPT 的 incomplete_tasks 字段说明 — 把措辞对齐 IMPLEMENT_PROMPT / IMPLEMENT_GROUP_PROMPT
  的现有版本：仅当 completion_status 为 partial 或 failed 时填写，complete 时必须为空数组。

  _render_implement 的 Incomplete Tasks 区块（step_renderers.py） — 按 completion_status
  选择标题 key 与项目符号样式：complete → 中性标题 + 中性 bullet；partial / failed / unknown → 现有红色标题
  + 红 ✗。dict 与字符串两种条目形态的解析逻辑（task_id/id、reason/error）在两条分支下完全一致地保留。

  i18n 语言包（en-US.json / zh-CN.json） — 新增中性标题 key（cli.steprender.implement.* 命名空间，携带
  {count} 占位与中性 Rich 标记），两份语言包 key 集合保持一致，en-US 为基准。

