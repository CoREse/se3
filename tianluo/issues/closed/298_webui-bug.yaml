  提案

  摘要

  修补 implement 步骤『汇报 complete 却同时列出未完成任务』暴露的两个缺口：一是在 implement.py 中新增一段共用的英文 prompt
  文案（测试范围默认针对性 + 无头运行契约），在模块内定义一次并注入 IMPLEMENT_PROMPT / IMPLEMENT_GROUP_PROMPT / FIX_PROMPT
  三份基础 prompt（HOLISTIC 与 CAPABILITY_GROUP 派生变体自然继承），并把 FIX_PROMPT 的 incomplete_tasks
  字段说明对齐另外两份；二是在 step_renderers.py 的 _render_implement 中，对『complete + 非空 incomplete_tasks』这一组合改用中性标题与中性项目符号渲染（新增
  cli.steprender.implement.* i18n key），partial / failed / unknown 的红色渲染保持不变。引擎状态判定、commit
  行为、WebUI、charter、.version 一律不动。


