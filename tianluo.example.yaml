# tianluo (SE 3.0) framework configuration — EXAMPLE
#
# This file is a shipped reference and is NOT read by the engine.
# To configure a project, either:
#   cp tianluo.example.yaml tianluo.yaml        # committed project config
# or maintain a gitignored local override:
#   tianluo.local.yaml                          # wins over tianluo.yaml
# (Legacy se3.yaml / se3.local.yaml keep working through 12.x.)
#
# This is a getting-started sample, not an exhaustive list of settings.
# Full reference (every block, every key): docs/configuration.md /
# docs/configuration.zh.md

human_call:
  timeout_days: 7
  directory: tianluo/calls  # Human calls directory (legacy: human-calls)

session:
  progress_file: progress.md
  max_progress_entries: 20

# Agent Registry (top-level identity layer)
# Every `llm_caller.*` or `confirmation.steps.*.reviewer` reference is
# resolved by name against this dict. Unknown names fail fast at startup.
# Global + project merge is entry-level: project entries override global
# entries with the same name; non-conflicting entries coexist.
agents:
  primary: { type: claude-code, cmd: claude, priority: 10 }
  backup: { type: claude-code, cmd: kclaude, priority: 5 }
  low:    { type: claude-code, cmd: hclaude, priority: 1 }

# LLM Caller Configuration
# `defaults` is the default caller chain by agent name (referencing
# entries in `agents` above). `steps.<step>` declares a HARD per-step
# override — there is no silent fallback to `defaults`, so if you want a
# default tail you must list it explicitly. Rotation on infrastructure
# errors happens strictly within the step's list.
llm_caller:
  defaults: [primary]
  steps:
    implement: [primary]
    summarize: [primary]

# Confirmation (Review) Configuration
# Per-step dict: a step is confirmed iff it appears as a key here.
# There is NO global on/off switch. Per-step `reviewer` accepts:
#   - "human"        → MCP call file / interactive approval pathway
#   - <agent name>   → single-agent LLM review against that agent
#   - omitted / null → LLM review via `llm_caller.defaults`
confirmation:
  steps:
    # plan-confirm is ALWAYS-ON: a CONFIRM running the dedicated
    # requirement-coverage review is inserted after every plan step
    # regardless of this block — even if this `plan` entry (or all of
    # confirmation.steps) is removed. This entry's scope is now narrowed to
    # customizing only the reviewer and max_iterations; it no longer gates
    # whether plan is confirmed. Omitting it falls back to LLM review via
    # llm_caller.defaults with the default max_iterations.
    plan:
      # reviewer omitted → LLM review via llm_caller.defaults
      max_iterations: 3
    # Adjudicate rules on spec contradictions and emits an override patch to the
    # task description and/or plan. It is 免确认 by default: with no entry here,
    # a ruling (including one that rewrites the *task description*) auto-passes
    # with no human/LLM门. Overriding the task description is high-impact, so if
    # an unattended run must NOT silently rewrite it, opt in to human review via
    # tianluo/calls (PAUSED approval) by uncommenting the block below. A plan-only
    # ruling is never human-gated even then; point `reviewer` at an LLM agent
    # name to auto-review plan-only overrides.
    # adjudicate:
    #   reviewer: human
    #   max_iterations: 3

# Version Bumping Configuration
# Automatically bump version on commit step based on task type
version:
  enabled: true                       # Enable automatic version bumping
  file_path: null                     # Explicit version file path (null = auto-detect)
  include_in_commit_message: true     # Include version in commit message
  auto_bump: true                     # Auto-apply bump without human confirmation

  # Optional: customize version rules by creating tianluo/version-rules.md
  # (natural-language Markdown). When absent, default SemVer 2.0.0 applies.

# Language Configuration
# Two independent language settings, merged project-over-global with
# ~/.se3/config.yaml.
language:
  # Unified human language: drives BOTH the CLI's fixed UI copy AND the
  # LLM human-facing step outputs (summarize / discovery / confirmed steps).
  # (The central WebUI console's interface language is a per-user browser /
  #  localStorage preference and does NOT follow this project setting.)
  # CLI resolution precedence: SE3_LANG env > this key > ~/.se3/config.yaml >
  # system locale (LANG/LC_ALL) > en-US. e.g. "zh-CN", "en-US".
  # null = no LLM-output restriction (CLI UI copy still resolves via the chain).
  language: zh-CN
  # Knowledge-asset language: the writing language of charter.md and the
  # code-index (injected into the charter_freshness and code-index summary
  # prompts). e.g. "zh-CN", "en-US". null = no restriction (LLM decides).
  spec_language: en-US

# End-to-end testing (optional, off by default)
#
# This block carries ONLY runtime settings. The *content* of e2e — the services
# topology, the declarative environment build steps, the scenario definitions and
# the baseline screenshots — lives in a separate `tianluo/e2e/` directory
# (alongside charter.md / code-index.md / issues/, committed to git), where the
# flow generates it on first use and evolves it incrementally thereafter. The
# flow never writes this file: `enabled` is your promise, not its decision.
#
#   tianluo/e2e/environment.yaml   services + base images + build steps + probes
#   tianluo/e2e/scenarios/*.yaml   one scenario per file: driver/actions/assertions
#   tianluo/e2e/baselines/         git-tracked baseline screenshots (tier-2 diffs)
#
# PREREQUISITE — enabling this means you have already installed a container
# runtime yourself, exactly as you installed the claude/codex CLIs; pip cannot
# provide one. tianluo runs entirely as your normal user and never calls sudo, so
# the requirement is that YOU can run `docker` or `podman` without sudo. Any one
# of these satisfies it:
#   - your user is in the `docker` group;
#   - rootless Docker;
#   - Podman, which is rootless natively.
# Run `luo e2e doctor` to check the host before enabling. A failing check is
# reported as an environment problem with remediation — it never enters the fix
# loop, because no amount of code editing installs Docker.
#
# The image-diff dependency for tier-2 visual assertions is an optional extra:
# `pip install 'tianluo[e2e]'`. The framework code and Dockerfile templates ship
# with every install; only that third-party dependency is isolated.
#
e2e:
  # Master switch, shown here at its default so the block stays inert until you
  # deliberately opt in. False (or an absent `e2e:` block) = the state machine
  # never inserts the E2E step and behaves exactly as it did before this
  # subsystem existed. When true, E2E runs after `test` and before `self_check`;
  # a failing scenario routes into the normal fix loop under
  # workflow.max_fix_iterations, just like a failing unit test.
  enabled: false

  # auto | docker | podman. Default `auto`.
  # `auto` probes by *executing* `docker info`, then `podman info`, and takes the
  # first that succeeds — a runtime that is installed but unusable by the current
  # user (no group membership, daemon down) counts as absent. With both usable it
  # picks docker, deterministically; ask for podman explicitly if you prefer it.
  # Naming a runtime explicitly disables fallback: if it is unavailable the run
  # fails with remediation rather than silently switching, which would change
  # image cache, storage location and UID mapping under you.
  runtime: auto

  # Passed through to the runtime's `--runtime` flag. Point it at a VM-grade OCI
  # runtime (Kata Containers and friends) to get VM-boundary isolation by
  # configuration alone. null = the runtime's own default.
  oci_runtime: null

  # Time budgets in seconds. Image builds are the slow half (cold layer cache),
  # scenarios the fast half, hence two separate budgets.
  build_timeout: 1800       # default 1800
  scenario_timeout: 300     # default 300, overridable per scenario

  # The e2e counterpart of test.estimated_test_duration: lets a supervising
  # runner tell "still running" apart from "hung". null = unknown.
  estimated_e2e_duration: null

  # Scenario selection, mirroring test.critical_tests. Empty = run every scenario
  # declared under tianluo/e2e/scenarios/. Narrow it so a fix loop need not
  # replay the whole suite on every iteration.
  scenarios: []
  # Scenarios that must genuinely run for the result to count: each one is added
  # to the selection above (narrowing `scenarios` cannot drop it), and a critical
  # scenario with no passing result fails the run. A name no scenario answers to
  # is a configuration error — the guarantee could never be met.
  critical_scenarios: []

  # Leave containers and the network alive after the run so you can attach and
  # look around. Debugging aid; default false.
  keep_environment: false

# Test step configuration
# `critical_tests` registers acceptance tests that MUST genuinely run during
# verification. If any of these is skipped or silently missing from the test
# results, the engine treats the run as unverified (tests_passed=False) instead
# of accepting "skip == no failures". Entries are matched as substrings against
# pytest's per-test ids (file::test), so a fully-qualified id is the precise
# anchor. Requires the browser extra: `pip install tianluo[browser]` then
# `playwright install chromium`.
test:
  critical_tests:
    - "tests/test_console_real_daemon_e2e.py::test_render_paradigm_in_headless_browser"

workflow:
  # Backstop only: with the deterministic pre-implement test baseline, a
  # correctly-scoped flow no longer loops on inherited failures, so this cap is
  # rarely reached. Kept at the documented default (100) and intentionally
  # identical to tianluo.local.yaml so the local override does not silently shadow a
  # different value (config loading is whole-file select-one, not key-merge).
  max_fix_iterations: 100

  # Period (in fix iterations) of the adjudicate step's catch-all safety net:
  # even when no oscillation signal fires, every N fix iterations force one
  # adjudicate run to catch drift the structural triggers missed. Set to 0 (or
  # null) to disable the periodic net (adjudicate then runs only on the
  # structural signal triggers: candidate oscillation / contradiction / recur).
  # Default: 10.
  adjudicate_period: 10

  # Defer-fix threshold for nested self_check chains. When a non-final
  # self_check pass finds FEWER than this many issues and none is critical/high
  # severity, its fix is deferred and the remaining passes run first; their
  # findings are then merged (deduped) into one consolidated fix loop. Set to 0
  # (or null) to disable — every issue-finding pass triggers fix immediately
  # (the historical behavior). Default: 0.
  # self_check_defer_fix_threshold: 0

# 调查步骤（investigate）配置
# investigate 面向『症状已知、原因不明』的问题做探索式根因调查：允许临时日志 /
# 验证性补丁等实验手段，但步骤结束前必须全部还原（净零 diff，由引擎前后快照校验，
# 引擎自身绝不 reset/checkout）。它自带一个与 fix loop 相互独立的有界循环——
# 一轮调查若未得出结论（conclusive=false），状态机再排一轮。
investigation:
  # 调查最多重跑几轮。打满仍未得出结论时，流程不失败：带着当前最优假设（标注为低
  # 置信）继续进入 PLAN。设为 0（或 null）表示无上限——与 workflow.max_fix_iterations
  # 的哨兵约定一致；负数会在加载时直接报错。默认：3。
  max_iterations: 3

# Preset Prompts (common-task library)
# Project-level presets override the built-in presets shipped with tianluo
# (read at runtime from the package, never copied by `luo init`). Each
# entry carries its task type and points at a prompt file committed with
# the project. Run with `luo run --preset <name>`; list with
# `luo run --preset list`.
presets:
  doc-sync:
    type: feature
    prompt_file: tianluo/prompts/doc-sync.md
