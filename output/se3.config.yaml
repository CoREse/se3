# SE 3.0 Framework Configuration
# 将此文件放置在项目根目录

# 每个openspec change中每组任务的最大数量
max_tasks_per_change: 5

# Human-as-MCP配置
human_call:
  # 默认超时天数（超时后标记为expired）
  timeout_days: 7
  # 调用文件存储目录
  directory: human-calls

# Agent Team配置
agent_team:
  # 启用的角色列表
  roles:
    - architect
    - implementer
    - reviewer
  # Agent通信目录
  comms_directory: agent-comms

# Session Protocol配置
session:
  # progress文件路径
  progress_file: progress.md
  # progress中保留的最大session记录数（超出后归档）
  max_progress_entries: 20

# Change管理配置
change:
  # 完成后是否自动提示归档
  auto_archive_prompt: true
