id: 068
title: The spec states issues should be read once ('一次读取') to serve both idempotency
  and lifecycle management. The implementation reads _existing_issues and _sync_issues
  once via _load_existing_issues(), but _process_gaps() creates new IssueManager instances
  and calls find_open_by_title() which re-reads the filesystem. This is correct for
  idempotency (newly created files are visible) but not strictly 'one read'.
description: 'The spec states issues should be read once (''一次读取'') to serve both
  idempotency and lifecycle management. The implementation reads _existing_issues
  and _sync_issues once via _load_existing_issues(), but _process_gaps() creates new
  IssueManager instances and calls find_open_by_title() which re-reads the filesystem.
  This is correct for idempotency (newly created files are visible) but not strictly
  ''one read''.


  Suggestion: Acceptable trade-off — filesystem re-reads provide stronger consistency.
  No change needed.'
