  **Last fix instructions:**

  Self-check found 2 issue(s) that need fixing:

  - [medium] src/se3/engine/merge/orchestrator.py:_handle_conflict lines 829-840:
  When build_conflict_context fails for non-fast strategies (default/strict), _handle_conflict
  returns ''conflict'' without setting report.failure_reason. In execute(), this falls
  through to the default failure_reason=''merge_conflict'', and the CLI shows ''git
  merge conflict (could not be resolved)''. The real error (context build failure)
  is only in the log. The code path at orchestrator.py:829-840 sets conflict_context_failed
  for fast mode but not for default/strict — if the same reason were reused, merge_cmd.py:360-364
  would print ''fast strategy failed to build conflict context'' which would also
  be wrong. Non-fast strategies need their own distinct failure_reason for this path,
  or the existing message needs to be made strategy-agnostic.

  - [low] src/se3/engine/merge/orchestrator.py:execute lines 288-306: In execute()
  at orchestrator.py:288-306, the ''guardrail_violation_call_failed'' result handler
  sets report.pending_human=True even though the human call file was NOT written (GuardrailCallFileError
  always carries call_file=None). This routes the CLI through the pending_human code
  path (merge_cmd.py:239-254) with exit code 130. The user sees a ''paused for human
  review'' framing, but there is no call file to respond to — it''s an unrecoverable
  failure, not a pending state. The error message text is accurate (''call file could
  not be written''), but pending_human=T
  
