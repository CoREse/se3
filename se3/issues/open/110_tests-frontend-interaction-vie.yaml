id: '110'
title: tests/frontend/interaction_view.test.mjs claims its reference implementations
  'MUST stay byte-for-byte equivalent to the functions shipped in app.js' and will
  catch divergence, but it never imports app.js and uses different function names
  (`classifyRole`/`shouldCollapseMessage`/`chipLabel(role,meta)`) than app.js (`isCollapsibleRole`/`COLLAPSIBLE_ROLES`/`chipLabel(norm)`).
  It cannot actually detect divergence. (test_app_pure.mjs does provide genuine coverage
  by importing app.js.) Also, neither .mjs file is executed by the Python-only pytest
  suite, so frontend regression coverage is manual — this overlaps with already-tracked
  issue 109.
description: 'tests/frontend/interaction_view.test.mjs claims its reference implementations
