description: 之前讨论过要不要给单个spec文件加体积的上限，当时的讨论是不用加，并且将spec加载变成了item加载。但是现在在update spec的时候，出现了单个spec文件太大，需要分次读的情况，这是否意味着还是得设置一个单个的上限大小？另外，再说回verify
  spec和update spec这些步骤，它们需要对全部的spec，有一定了解（或者其实是不是只需要对牵涉到的那些有了解就行了？），但是当项目变得很大的时候，spec也会变得很大，这个步骤是否可能超出llm的上下文承受能力？有什么思路解决这个问题吗？按理说，人能理解的上下文也是有限的，但是人就不会因为这种问题而被限制，可以从这个角度入手？
