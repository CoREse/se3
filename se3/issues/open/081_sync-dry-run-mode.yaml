id: '081'
title: '[sync] 缺少 dry-run 预览模式'
description: >
  sync 会直接修改 spec 文件和创建 issue。用户第一次跑不敢选 fast，
  但 strict 又要逐个手动决策。缺一个 "只分析不执行" 的预览模式。

  建议增加 --dry-run 选项：
  1. 执行完整分析（gaps/extensions/conflicts）
  2. 输出所有将要执行的操作列表
  3. 不实际写文件、不创建 issue
  4. 让用户审阅后决定用哪个模式正式执行
status: open
priority: medium
scope: in_scope
type: feature
tags:
