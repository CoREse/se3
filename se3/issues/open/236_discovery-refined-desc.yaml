description: discovery的refined desc里面不要出现诸如“默认选择，可改”这类的给用户看的决策点语句。这个desc是发给下游的run步骤的，不是给人看的（当然人需要审阅），不应该包含这类容易造成误解的内容。所有这些给人看的“可改”之类的注解，应该放在refined
  desc前面的回复正文里，而不应该放在refined desc里。
