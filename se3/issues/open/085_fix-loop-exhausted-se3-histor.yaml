  **Last fix instructions:**

  Self-check found 2 issue(s) that need fixing:

  - [medium] src/se3/engine/chat_history.py:fold_spec_content() lines ~1050-1056 (known
  titles) and ~1068-1075 (unknown titles fallback): In fold_spec_content(), the fallback
  paths for both known and unknown spec titles call _fold_spec_subsections(content)
  without strict_starts when all _SPEC_BLOCK_RE matches are inside code fences but
  real ### subsections exist outside fences. This causes any fenced ### headings to
  be incorrectly folded as specs too. The fallback should compute strict_starts from
  _SPEC_SUBSECTION_RE matches that are outside code fences and pass them to _fold_spec_subsections().

  - [low] src/se3/engine/chat_history.py:_SPEC_BLOCK_RE definition lines ~848-855:
  _SPEC_BLOCK_RE allows at most 5 blank lines between ''### spec-name'' and the ''#
  Title'' H1 heading. A malformed or unusually formatted spec with 6+ blank lines
  will not be recognized as a real spec block, which can prevent the strict_starts-based
  code-fence filtering from engaging for that subsection.


  Fix the issues listed above and ensure the logic is correct.'
