id: '286'
description: 'merge_integrate 应在 merge 前自动 commit 主仓库的 issue 状态改动（先 commit 再 merge）。


  现状：session 在主仓库开/关 issue（se3/issues/ 下的文件与 .next_id）是常态，这些改动在 flow 的
  commit 步骤之前一直处于未提交状态。当某个 worktree 分支合回来恰好也改了同一文件（典型是
  se3/issues/.next_id）时，git 以 "Your local changes would be overwritten by merge"
  拒绝启动 merge。未提交改动不是提交方，无法进入三方合并，deterministic/LLM resolver 根本没有上场机会。


  实例：flow 20260710-101503_f0285271 合并
  worktree/agent-claude-codex-agent-claud-20260710-101503-0efb74d4 时被主仓库未提交的
  .next_id（283→285）挡住，两次重试同样失败（se3/logs/merge_20260710_173036_650331.log）。


  修法：merge_integrate 启动前检测 dirty tracked files——若全部位于 se3/issues/ 等 SE3
  自管数据路径，自动打一个 "chore: sync issue state" 提交再开始 merge；此后 .next_id
  的冲突成为正常三方冲突，可交给 deterministic resolver（语义为取 max，与 #280 的
  code-index resolver 同类）。


  附带修复：(1) _abort_merge 应把 "There is no merge to abort (MERGE_HEAD missing)"
  视为成功，否则所有 merge 启动前的失败都被改写成误导性的 merge_abort_failed（本例
  failure_detail 为 null，真实原因被完全掩盖）；(2) dirty 文件不在自管路径内时应报专用的
  dirty_working_tree failure_reason 并在 failure_detail 中列出文件清单。'
