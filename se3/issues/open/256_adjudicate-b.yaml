description: '== 动机（2026-07-04 flow 20260704-003700_4055d799 实测数据） ==

  一份规范（#243/#244 冷热拆分）含三个真矛盾，被拆成三案三审串行处理：

  - 59_adjudicate（R27+R29 配对触发）：B2『只重写变化的冷文件』×B3『损坏降级置空』@ step 冷文件 → B3-i 描述补丁（人工门
  1）

  - 62_adjudicate（R28+R30 配对触发）：同一矛盾 @ _context.json → plan 补丁，裁决书不得不显式"镜像 B3-i 已定规则"

  - 64_adjudicate（R1+R31 配对触发）：A1 stat 缓存 × 活跃文件新鲜度（独立矛盾）→ A4 描述补丁（人工门 2）

  其中 62 是 59 的同一矛盾在姊妹表面上的投影：59 裁决时账本里已有 context 位置的 R28 孤证，且"B2/B3 是否按构造覆盖 _context.json"当时即可判定。若
  59 一次划全，可省一次 adjudicate + 一整轮裁决后复审（约 15-20 分钟墙钟），且边界条款一条写全两个表面，规范更一致（实际发生的是描述补丁+plan
  补丁两处镜像）。两个人工门间隔约 70 分钟，合并可减一次人工等待。


  == 方案 ==

  触发器、指纹账本、配对要求全部不动（取证确认触发层零积压：三案均为第二条观测落账当轮触发）。改动集中在 adjudicate step 内部：


  1. 同构清扫指令（prompt）：裁定候选为 internal_contradiction 并确定条款对 X×Y 后，要求 adjudicator 收尾清扫——枚举规范中
  X 与 Y **按构造同时覆盖**的其它表面。判据是纯规范结构（"X 管不管表面 S？Y 管不管？都管 ⇒ 同一矛盾按构造成立"），账本观测与当前轮 issue
  列表作为线索输入，但成立与否以 by-construction 论证为准，不靠自由联想整份规范。确认的表面写进**同一份边界条款**。

  2. 保守性不对称原则（prompt 硬规则）：不确定的表面一律不划。代价不对称——漏划的表面等自身证据到达会再触发，成本一次 no-op 级裁决（已验证便宜且通畅）；错划则把错误约束写进契约，需再开一次裁决撤销并污染中间所有复审。宁漏勿错。

  3. ruling schema 增加 covered_surfaces: [{surface, justification}]：每个纳入边界条款的表面必须附
  by-construction 论证；确认门渲染该列表，审批者一眼可见"这条边界声称管哪几个表面、凭什么"，错划在人工门即被拦截。

  4. description 与 plan 一次出全：矛盾同时体现在描述与 plan 验收条款时，同一份 ruling 同时产出 adjudicated_description
  与 adjudicated_plan（schema 已支持，prompt 要求裁全），不留给下一轮镜像。


  == 明确不做 ==

  - 不做账本休眠候选清扫（本提案的早期版本）：取证证伪——孤证位置扫不出配对，59 时点 context/cache 均仅一条观测，清扫无收益。

  - v1 不做按条款对粒度的账本免疫：错划风险之外，同一位置未来可能出现引用不同条款对的新矛盾，位置级免疫会误伤；不免疫的最坏后果是姊妹表面再触发一次并被 review_divergence
  驳回（自愈，成本一次空跑）。若实践中空跑频繁再引入。

  - discovery 阶段规范一致性 lint（绝对量词作用域引导）为独立上游手段，另立 issue，不并入。


  == 验收 ==

  - 复刻今日场景的集成用例：规范含同一条款对覆盖两个表面的矛盾，触发一次裁决即产出覆盖两表面的单一边界条款 + covered_surfaces 论证，第二表面不再触发独立裁决。

  - covered_surfaces 中每项均有 justification，确认门可见。

  - 不确定表面未被纳入时，其后续独立触发路径不受影响（回归现有行为）。'
